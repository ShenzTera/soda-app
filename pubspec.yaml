name: jamals_addiction
description: >-
  Jamal's Addiction — Luxury Soda Telemetry, Soda Calendar, and Soda Wrapped
  for iOS & Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/coke.png
    - assets/images/pepsi.png
    - assets/images/dew.png
    
flutter_launcher_icons:
  image_path: "assets/icon/soda_tracker_icon.jpeg"
  android: true
  ios: true
