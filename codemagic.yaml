workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r ../ipa/app-release.zip Payload
          cd ../ipa
          mv app-release.zip app-release.ipa
    artifacts:
      - build/ios/ipa/*.ipa
